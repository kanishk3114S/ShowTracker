# Render Blueprint: one API (web service) + one static site for the React app.
# Dashboard: New > Blueprint > pick this repo. Fill in every value marked "sync: false".
services:
  # ---------------------------------------------------------------- API
  - type: web
    name: showtracker-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      # The https:// address of the static site below, for example https://showtracker-web.onrender.com
      - key: CLIENT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Restricted showtracker_app role (pooler URI)
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_READ_ACCESS_TOKEN
        sync: false
      # Optional: TheTVDB key, the second fallback when TMDB is slow (TVMaze needs none)
      - key: TVDB_API_KEY
        sync: false

  # ------------------------------------------------------------ Frontend
  - type: web
    name: showtracker-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Single-page app: every path must serve index.html (without this, refreshing /explore is a 404)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://image.tmdb.org https://s4.anilist.co https://static.tvmaze.com https://artworks.thetvdb.com https://*.supabase.co https://lh3.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.onrender.com https://*.up.railway.app; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
    # VITE_* values are baked in at BUILD time: change one, then redeploy (a restart is not enough)
    envVars:
      - key: NODE_VERSION
        value: 22
      # The https:// address of the API service WITH /api, for example https://showtracker-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SITE_URL
        sync: false
