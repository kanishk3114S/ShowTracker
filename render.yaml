# Render Blueprint: ONE unified web service. Express serves the built React app AND the /api routes
# from the same address, so the site cannot load without the backend (and there is no CORS to configure).
# Dashboard: New > Blueprint > pick this repo. Fill in every value marked "sync: false".
#
# Free plan: the service sleeps after ~15 min without traffic. To keep it awake, point an uptime monitor
# (UptimeRobot, 5 min interval) at https://<your-service>.onrender.com/api/health, or use a paid plan
# (change `plan: free` to `plan: starter`). See README > Deployment.
services:
  - type: web
    name: showtracker
    runtime: node
    plan: free
    # Installs and builds the client (devDependencies are needed by Vite), then installs the server.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      # ---- server-side secrets (never exposed to the browser)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Restricted showtracker_app role (pooler URI)
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_READ_ACCESS_TOKEN
        sync: false
      # Optional: TheTVDB key, the second fallback when TMDB is slow (TVMaze needs none)
      - key: TVDB_API_KEY
        sync: false
      # ---- build-time values for the React app (public by design; baked in when `npm run build` runs).
      # Change one, then trigger a NEW deploy: a restart is not enough.
      # Do NOT set VITE_API_URL: the app then calls the same origin at /api.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SITE_URL
        sync: false
