<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="ShowTracker: one account, one library, everything you watch. Track anime, movies and TV shows." />
    <meta name="color-scheme" content="dark" />

    <!-- OpenGraph (link previews). __SITE_URL__ is replaced at build time from VITE_SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShowTracker" />
    <meta property="og:title" content="ShowTracker: your watchlist, your stories, your universe" />
    <meta property="og:description" content="Track anime, movies and TV shows episode by episode in one private library, and share a profile you are proud of." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ShowTracker: a gold clapperboard logo on a dark film-strip background" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShowTracker: your watchlist, your stories, your universe" />
    <meta name="twitter:description" content="Track anime, movies and TV shows episode by episode in one private library." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&text=%E3%80%8E%E3%80%8F%E7%89%A9%E8%AA%9E%E8%A8%98%E9%8C%B2%E6%9B%B8%E5%BA%AB&display=swap"
      rel="stylesheet"
    />
    <title>ShowTracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
